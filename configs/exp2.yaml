# Exp.2 — Pretrained universality (Figures 7–10)
# NOTE: this is scaffold-only unless you provide valid checkpoint paths + adapter code.
run:
  name: exp2_pretrained
  seed: 0
  out_dir: runs

device:
  device: auto
  dtype: float32

gamma_grid:
  gamma_min: 1.0e-3
  gamma_max: 1.0e3
  num: 21

eigs:
  top_k: 10
  method: power
  power_iters: 60
  power_tol: 1.0e-6

data:
  dataset: random_gaussian  # for pipeline testing; replace with real dataset loader
  num_samples: 16
  dim: 128  # flattened dimension for random_gaussian

models:
  # Each entry should specify a family name + checkpoint_path + adapter_type.
  # Adapter implementations live under src/pci/models/adapters/.
  - model_family: ddpm
    adapter_type: oracle_gaussian
    checkpoint_path: null
  - model_family: edm
    adapter_type: oracle_gaussian
    checkpoint_path: null
  - model_family: fm
    adapter_type: oracle_gaussian
    checkpoint_path: null
  - model_family: rf
    adapter_type: oracle_gaussian
    checkpoint_path: null

plots:
  make_figures: true
  formats: ["pdf", "png"]
